<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 // SPRINT ROOM NOT FOUND — MATIKS</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#090c0a" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background-color: #090c0a;
        color: #e8ece3;
        font-family: 'Space Mono', monospace, ui-monospace, monospace;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card {
        background: #0f1411;
        border: 3px solid #2ee58f;
        box-shadow: 8px 8px 0px #2ee58f;
        border-radius: 12px;
        padding: 48px 32px;
        max-width: 540px;
        width: 100%;
      }
      .code {
        color: #ff6b5e;
        font-size: 64px;
        font-weight: 800;
        line-height: 1;
        margin-bottom: 16px;
        text-shadow: 2px 2px 0px #000;
      }
      h1 {
        font-size: 22px;
        font-weight: 700;
        color: #2ee58f;
        margin-bottom: 12px;
        letter-spacing: -0.5px;
      }
      p {
        color: #a4b3a2;
        font-size: 14px;
        line-height: 1.6;
        margin-bottom: 32px;
      }
      .btn {
        display: inline-block;
        background: #2ee58f;
        color: #090c0a;
        text-decoration: none;
        font-weight: 700;
        font-size: 15px;
        padding: 14px 28px;
        border: 2px solid #090c0a;
        border-radius: 8px;
        box-shadow: 4px 4px 0px #18221c;
        transition: transform 0.1s ease, box-shadow 0.1s ease;
      }
      .btn:hover {
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0px #18221c;
      }
      .btn:active {
        transform: translate(2px, 2px);
        box-shadow: 0px 0px 0px #18221c;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="code">404</div>
      <h1>EQUATION_NOT_FOUND</h1>
      <p>The squad room, session ID, or challenge route you requested does not exist or has expired.</p>
      <a href="/" class="btn">⚡ RETURN TO LOBBY</a>
    </div>
  </body>
</html>
