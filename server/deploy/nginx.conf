# MATIKS HACKATHON ENGINE — PRODUCTION NGINX REVERSE PROXY CONFIGURATION
# Optimized for high-concurrency LAN tournaments, auditorium projectors, and mobile client networks.

worker_processes auto;
events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Upstream Node.js / Express backend
    upstream matiks_backend {
        server 127.0.0.1:3000;
        keepalive 64;
    }

    # -------------------------------------------------------------
    # 1. HTTP Listener: Serves local LAN tournaments
    #    (or redirects to HTTPS if running with TLS certificates)
    # -------------------------------------------------------------
    server {
        listen 80;
        server_name localhost _;

        # When running behind an external TLS terminator (e.g. AWS ALB, Cloudflare),
        # enforce HTTPS redirect if X-Forwarded-Proto is http:
        # if ($http_x_forwarded_proto = "http") {
        #     return 301 https://$host$request_uri;
        # }

        # Client frontend static assets (Vite production build)
        root /var/www/matiks/client/dist;
        index index.html;

        # Gzip compression for static files and standard JSON API responses
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss text/javascript image/svg+xml;
        gzip_vary on;
        gzip_min_length 1024;

        # Realtime SSE Streams: Unbuffered, zero-latency proxying
        location /api/sse/ {
            proxy_pass http://matiks_backend;
            proxy_http_version 1.1;

            # Clear Connection header to allow persistent HTTP/1.1 keepalive with upstream
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Pass browser Last-Event-ID header for reconnection replay
            proxy_set_header Last-Event-ID $http_last_event_id;

            # Critical SSE proxying controls: Disable all proxy buffering and caching
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header X-Accel-Buffering no;
            chunked_transfer_encoding on;

            # Keep event stream open without proxy-enforced disconnects
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # Gzip MUST be disabled for SSE to prevent compression buffering
            gzip off;
        }

        # REST API Endpoints
        location /api/ {
            proxy_pass http://matiks_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # Immutable versioned Vite bundle assets
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Single-Page Application (SPA) Fallback (index.html revalidated immediately)
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

